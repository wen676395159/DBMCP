; This is an example configuration file.
; Copy this file to 'config.ini' in the same directory (nl_to_chart_tool/backend/)
; and fill in your actual API keys and settings.
; DO NOT commit your actual 'config.ini' file to version control.

[api_keys]
; DeepSeek API Key
deepseek_api_key = YOUR_DEEPSEEK_API_KEY_HERE

; Qwen (DashScope) API Key
; Can be either QWEN_API_KEY or DASHSCOPE_API_KEY based on your setup
qwen_api_key = YOUR_QWEN_API_KEY_HERE
; another_example_key = some_value

[ollama_settings]
; Default model to use for Ollama if not specified in the request
default_model = llama2
; Specify Ollama API endpoint if it's not the default http://localhost:11434
; endpoint = http://localhost:11434

[deepseek_settings]
default_model = deepseek-coder
; Add other deepseek specific settings here if needed

[qwen_settings]
default_model = qwen-turbo
; Add other qwen specific settings here if needed

; [database_settings]
; Example for future database configurations
; type = mysql
; host = localhost
; port = 3306
; user = your_db_user
; password = your_db_password
; dbname = your_db_name
